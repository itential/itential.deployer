---
# ============================================================================
# Gateway PKI Configuration - All components customizable
# ============================================================================

# Base PKI directory - override to use different root location
gateway_pki_base_dir: /etc/pki/automation-gateway

# Subdirectory names - customize the layout
gateway_pki_private_subdir: private
gateway_pki_https_subdir: https

# Derived subdirectory paths - built from base + subdir name
gateway_pki_private_dir: "{{ gateway_pki_base_dir }}/{{ gateway_pki_private_subdir }}"
gateway_pki_https_dir: "{{ gateway_pki_base_dir }}/{{ gateway_pki_https_subdir }}"

# ============================================================================
# Certificate and Key Filenames - Customize naming
# ============================================================================

# HTTPS server certificate filename
gateway_https_cert_filename: "{{ inventory_hostname }}.crt"

# HTTPS server private key filename
gateway_https_key_filename: "{{ inventory_hostname }}.key"

# HTTPS CA bundle filename
gateway_https_ca_filename: ca-bundle.crt

# ============================================================================
# Full Certificate Paths - Built from components
# ============================================================================

# HTTPS server certificate path
gateway_https_cert_file: "{{ gateway_pki_https_dir }}/{{ gateway_https_cert_filename }}"

# HTTPS server private key path
gateway_https_key_file: "{{ gateway_pki_private_dir }}/{{ gateway_https_key_filename }}"

# HTTPS CA bundle path
gateway_https_ca_file: "{{ gateway_pki_https_dir }}/{{ gateway_https_ca_filename }}"

# ============================================================================
# Source Directory - Define in inventory
# ============================================================================

# Source directory for certificate files (on Ansible controller)
gateway_pki_src_dir: ""

# ============================================================================
# Source File Paths - Built from source directory + filename
# ============================================================================

# HTTPS source paths - auto-build from source dir + filename
gateway_https_cert_source: "{{ gateway_pki_src_dir }}/{{ gateway_https_cert_filename }}"
gateway_https_key_source: "{{ gateway_pki_src_dir }}/{{ gateway_https_key_filename }}"
gateway_https_ca_source: "{{ gateway_pki_src_dir }}/{{ gateway_https_ca_filename }}"

# ============================================================================
# File Ownership - Customize per environment
# ============================================================================

# Owner for PKI directories and files
gateway_pki_owner: "{{ gateway_user }}"

# Group for PKI directories and files
gateway_pki_group: "{{ gateway_group }}"

# ============================================================================
# File Permissions - Customize per security requirements
# ============================================================================

# Base PKI directory permissions
gateway_pki_base_dir_mode: "0750"

# Subdirectory permissions
gateway_pki_subdir_mode: "0750"

# Private directory permissions
gateway_pki_private_dir_mode: "0700"

# HTTPS certificate permissions
gateway_https_cert_mode: "0644"

# HTTPS private key permissions
gateway_https_key_mode: "0600"

# HTTPS CA bundle permissions
gateway_https_ca_mode: "0644"

# ============================================================================
# Backward Compatibility - Legacy Variable Names
# These maintain compatibility with existing templates
# ============================================================================

# Legacy variables for templates (point to new paths)
gateway_ssl_cert_dest: "{{ gateway_https_cert_file }}"
gateway_ssl_key_dest: "{{ gateway_https_key_file }}"
gateway_ssl_rootca_dest: "{{ gateway_https_ca_file }}"