---

- name: Run Gateway Verification Tasks
  hosts: gateway
  gather_facts: true
  become: true
  tasks:
    - name: Verify Gateway Installation  # noqa run-once
      ansible.builtin.import_role:
        name: itential.deployer.gateway
        tasks_from: verify-gateway
