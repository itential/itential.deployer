---

# The itential-platform RPM declares itential:itential ownership on every path it
# ships, so installing it resets any ownership set beforehand. platform_server_dir
# and platform_services_dir live under platform_root_dir, so they are covered by it.
# The root and home trees are shipped by the RPM and are re-owned recursively. The
# config and log dirs only hold files created after the install, so only the
# directories themselves are re-owned.
# Using chown is much faster than the file module with recurse (seconds vs. minutes
# for ~250k files). -h re-owns symlinks (e.g. <home>/bin/python3) rather than their targets.
- name: Set appropriate ownership on all itential files
  ansible.builtin.shell:
    cmd: >-
      chown -hR {{ platform_user }}:{{ platform_group }}
      {{ platform_root_dir | quote }}
      {{ platform_itential_home_dir | quote }} &&
      chown -h {{ platform_user }}:{{ platform_group }}
      {{ platform_config_dir | quote }}
      {{ platform_log_dir | quote }}
  changed_when: true
