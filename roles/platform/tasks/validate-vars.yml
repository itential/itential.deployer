---
- name: Validate and set installation variables
  tags: always
  block:
    # platform_packages entries can be a plain string (filename or URL, as
    # before) or a {url, checksum} dict for customers who require validated
    # downloads. Normalizes to the format every other task in this role
    # expects (a flat list of strings) plus an internally-computed
    # platform_package_checksums dict, so nothing downstream needs to know
    # about the two accepted input shapes.
    - name: Initialize normalized platform package facts
      ansible.builtin.set_fact:
        platform_package_urls: []
        platform_package_checksums: {}
      when: platform_packages is defined

    - name: Normalize platform_packages entries into URLs/filenames and checksums
      ansible.builtin.set_fact:
        platform_package_urls: "{{ platform_package_urls + [(item is mapping) | ternary(item.url, item)] }}"
        platform_package_checksums: >-
          {{ platform_package_checksums | combine({(item.url): item.checksum} if (item is mapping and item.checksum is defined) else {}) }}
      loop: "{{ platform_packages }}"
      when: platform_packages is defined

    - name: Replace platform_packages with its normalized plain-string form
      ansible.builtin.set_fact:
        platform_packages: "{{ platform_package_urls }}"
      when: platform_packages is defined

    - name: Validate Itential Platform packages array is populated
      ansible.builtin.assert:
        that:
          - platform_packages is defined
          - platform_packages is iterable
          - platform_packages | length > 0
        fail_msg: platform_packages must be defined and contain as least one artifact
      when: not offline_install_enabled | bool

    - name: Validate Itential Platform packages array contains only RPMs
      ansible.builtin.assert:
        that: "{{ item.endswith('.rpm') }}"
        fail_msg: platform_packages can only contain RPM packages ending in .rpm"
      loop: "{{ platform_packages }}"
      when: not offline_install_enabled | bool

    - name: Validate download auth method is defined when downloading Itential Platform packages
      ansible.builtin.assert:
        that: (repository_username is defined and repository_password is defined) or
              repository_api_key is defined
        fail_msg: >-
          repository_api_key or repository_username/repository_password
          must be defined when downloading platform_packages
      when:
        - not offline_install_enabled | bool
        - platform_packages is search('http')

    - name: Validate installation variables are defined
      ansible.builtin.assert:
        that: |
          (platform_release is defined) or
          (platform_nodejs_package is defined and
           platform_python_version is defined and
           platform_python_packages is defined and
           platform_python_app_dependencies is defined)
        fail_msg: >-
          platform_release OR
          platform_nodejs_package, platform_python_version, platform_python_packages, and
          platform_python_app_dependencies must be defined

    - name: Validate installation variables when not using platform_release
      ansible.builtin.assert:
        that:
          - platform_nodejs_package is defined
          - platform_python_version is defined
          - platform_python_packages is defined
          - platform_python_app_dependencies is defined
        fail_msg: >-
          platform_nodejs_package, platform_python_version, platform_python_packages, and
          platform_python_app_dependencies must be defined when platform_release is not defined
      when: platform_release is not defined

    - name: Validate that the platform_encryption_key variable exists
      ansible.builtin.assert:
        that: platform_encryption_key is defined
        fail_msg: platform_encryption_key variable must be defined
      when: validate_platform_encryption_key | default(true)

    - name: Validate that the platform_encryption_key variable is correctly formatted
      ansible.builtin.assert:
        that:
          - platform_encryption_key is match('^[0-9a-fA-F]+$')
          - platform_encryption_key | length == 64
        fail_msg: platform_encryption_key must be a 64 character hexadecimal string
      when: validate_platform_encryption_key | default(true)

    - name: Validate Itential Platform directories are not system directories
      ansible.builtin.assert:
        that: >-
          (item | regex_replace('(?<=.)/+$', '')) not in
          ['/', '/bin', '/boot', '/dev', '/etc', '/home', '/lib', '/lib64', '/media', '/mnt',
           '/opt', '/proc', '/root', '/run', '/sbin', '/srv', '/sys', '/tmp', '/usr', '/var',
           '/var/log']
        fail_msg: >-
          {{ item }} is a system directory. Itential Platform changes ownership of
          platform_root_dir, platform_config_dir, platform_log_dir and
          platform_itential_home_dir to platform_user:platform_group. Set them to
          dedicated directories.
      loop:
        - "{{ platform_root_dir }}"
        - "{{ platform_config_dir }}"
        - "{{ platform_log_dir }}"
        - "{{ platform_itential_home_dir }}"

    - name: Validate platform_log_dir can be relocated
      ansible.builtin.assert:
        that: platform_log_dir | basename == platform_log_dir_default | basename
        fail_msg: >-
          platform_log_dir must end in /{{ platform_log_dir_default | basename }}. The
          itential-platform RPM only relocates the parent directory
          ({{ platform_log_dir_default | dirname }}) and always creates
          {{ platform_log_dir_default | basename }} beneath it.

    - name: Validate that platform_otel_webserver_metrics_enabled is a boolean when set
      ansible.builtin.assert:
        that: platform_otel_webserver_metrics_enabled is none or platform_otel_webserver_metrics_enabled is boolean
        fail_msg: >-
          platform_otel_webserver_metrics_enabled must be a boolean (true or false) when set.
          Strings such as "true" or "false" are not accepted.

    - name: Validate Hashicorp Vault variables
      when: platform_configure_vault | bool
      block:
        - name: Validate Hashicorp token is set when using token authentication
          ansible.builtin.assert:
            that: platform_vault_token is truthy
            fail_msg: platform_vault_token must be defined when using token authentication
          when: platform_vault_auth_method == 'token'

        - name: Validate Hashicorp approle id and secret id are set when using approle authentication
          ansible.builtin.assert:
            that:
              - platform_vault_role_id is truthy
              - platform_vault_secret_id is truthy
            fail_msg: platform_vault_role_id and platform_vault_secret_id must be defined when using approle authentication
          when: platform_vault_auth_method == 'approle'

    - name: Validate platform_https_pki_src_dir and platform_pki_base_dir when copying HTTPS certificates
      ansible.builtin.assert:
        that:
          - platform_https_pki_src_dir is defined
          - platform_https_pki_src_dir | length > 0
          - platform_pki_base_dir is defined
          - platform_pki_base_dir | length > 0
        fail_msg: >-
          platform_https_pki_src_dir and platform_pki_base_dir must be defined and cannot be empty
          when platform_webserver_https_copy_certs is enabled.
        success_msg:
          - "platform_https_pki_src_dir is set to: {{ platform_https_pki_src_dir }}"
          - "platform_pki_base_dir is set to: {{ platform_pki_base_dir }}"
      when: platform_webserver_https_copy_certs | bool

    - name: Validate platform_pki_base_dir when HTTPS is enabled
      ansible.builtin.assert:
        that:
          - platform_pki_base_dir is defined
          - platform_pki_base_dir | length > 0
        fail_msg: >-
          platform_pki_base_dir must be defined and cannot be empty
          when platform_webserver_https_enabled is true.
        success_msg: "platform_pki_base_dir is set to: {{ platform_pki_base_dir }}"
      when:
        - not (platform_webserver_https_copy_certs | bool)
        - platform_webserver_https_enabled | bool

    - name: Validate platform_mongodb_pki_src_dir and platform_pki_base_dir when copying MongoDB certificates
      ansible.builtin.assert:
        that:
          - platform_mongodb_pki_src_dir is defined
          - platform_mongodb_pki_src_dir | length > 0
          - platform_pki_base_dir is defined
          - platform_pki_base_dir | length > 0
        fail_msg: >-
          platform_mongodb_pki_src_dir and platform_pki_base_dir must be defined and cannot be empty
          when platform_mongodb_copy_certs is enabled.
        success_msg:
          - "platform_mongodb_pki_src_dir is set to: {{ platform_mongodb_pki_src_dir }}"
          - "platform_pki_base_dir is set to: {{ platform_pki_base_dir }}"
      when: platform_mongodb_copy_certs | bool

    - name: Validate platform_pki_base_dir when MongoDB TLS is enabled
      ansible.builtin.assert:
        that:
          - platform_pki_base_dir is defined
          - platform_pki_base_dir | length > 0
        fail_msg: >-
          platform_pki_base_dir must be defined and cannot be empty
          when platform_mongo_tls_enabled is true.
        success_msg: "platform_pki_base_dir is set to: {{ platform_pki_base_dir }}"
      when:
        - not (platform_mongodb_copy_certs | bool)
        - platform_mongo_tls_enabled | bool

    - name: Set installation variables when using Itential Platform release defaults
      when: platform_release is defined
      block:
        - name: Load Itential Platform release default variables
          ansible.builtin.include_vars:
            file: "{{ item }}"
          with_first_found:
            - "platform-release-{{ platform_release }}.yml"
            - "platform-release-{{ platform_release | string | split('.') | first }}.yml"
            - "platform-release-undefined.yml"

        - name: Check for valid Itential Platform release
          ansible.builtin.assert:
            that: platform_invalid_release is not defined
            fail_msg: >-
              Deployer does not support installing Itential Platform release {{ platform_release }}"

        - name: Check for valid OS for Itential Platform installation
          ansible.builtin.assert:
            that: ansible_os_family == 'RedHat'
            fail_msg: >-
              Deployer does not support installing Itential Platform on {{ ansible_distribution }}.
              Supported platforms: Red Hat family (RHEL 8/9/10, Rocky Linux 8/9/10, AlmaLinux 8/9/10, Amazon Linux 2023).

        - name: Set platform_nodejs_package to the default value
                when not defined in inventory
          when: platform_nodejs_package is not defined
          block:
            - name: Find the Itential Platform RPM on the control node
              ansible.builtin.find:
                paths: "{{ platform_offline_control_node_rpms_dir }}/platform"
                patterns: "itential-platform-*.rpm"
              register: platform_offline_rpm_find
              delegate_to: localhost
              become: false
              when: offline_install_enabled | bool

            - name: Determine the Itential Platform version from the Itential Platform RPM
              ansible.builtin.set_fact:
                platform_rpm_versions: >-
                  {{ ((platform_offline_rpm_find.files | map(attribute='path')
                       if offline_install_enabled | bool else platform_packages)
                      | map('basename')
                      | select('match', 'itential-platform-[0-9]')
                      | map('regex_search', '[0-9]+[.][0-9]+[.][0-9]+')
                      | select | unique | list) }}

            - name: Validate a single Itential Platform version was found
              ansible.builtin.assert:
                that: platform_rpm_versions | length == 1
                fail_msg: >-
                  Unable to determine the Itential Platform version from the
                  itential-platform RPM. Found versions: {{ platform_rpm_versions }}.
                  Exactly one itential-platform-X.Y.Z RPM is required in
                  {{ (platform_offline_control_node_rpms_dir + '/platform')
                     if offline_install_enabled | bool else 'platform_packages' }}.
                  Alternatively, define platform_nodejs_package.

            - name: Set platform_version from the Itential Platform RPM
              ansible.builtin.set_fact:
                platform_version: "{{ platform_rpm_versions | first }}"

            - name: Set the Node.js major version required by the Itential Platform version
              ansible.builtin.set_fact:
                platform_nodejs_major_version: >-
                  {{ '22' if platform_version is version(
                       platform_nodejs_22_min_platform_version, '>=')
                     else '20' }}

            - name: Validate Node.js is available for the OS
              ansible.builtin.assert:
                that: >-
                  ansible_distribution_major_version in
                  platform_nodejs_package_default[platform_nodejs_major_version]
                fail_msg: >-
                  Itential Platform {{ platform_version }} requires
                  Node {{ platform_nodejs_major_version }}, which is not available on
                  {{ ansible_distribution }} {{ ansible_distribution_major_version }}.

            - name: Set platform_nodejs_package from the Node.js major version and OS
              ansible.builtin.set_fact:
                platform_nodejs_package: >-
                  {{ platform_nodejs_package_default[platform_nodejs_major_version]
                     [ansible_distribution_major_version] }}

        - name: Set platform_python_version to the default value
                when not defined in inventory
          ansible.builtin.set_fact:
            platform_python_version:
              "{{ platform_python_version_default[ansible_distribution_major_version] }}"
          when: platform_python_version is not defined

        - name: Set platform_python_packages to the default value
                when not defined in inventory
          ansible.builtin.set_fact:
            platform_python_packages:
              "{{ platform_python_packages_default[ansible_distribution_major_version] }}"
          when: platform_python_packages is not defined

        - name: Set platform_python_app_dependencies to the default value
                when not defined in inventory
          ansible.builtin.set_fact:
            platform_python_app_dependencies:
              "{{ platform_python_app_dependencies_default[ansible_distribution_major_version] }}"
          when: platform_python_app_dependencies is not defined

    - name: Validate offline install directory for the target OS
      when: offline_install_enabled | bool
      block:
        - name: Stat offline packages directory on the control node
          ansible.builtin.stat:
            path: "{{ platform_offline_control_node_root }}"
          register: platform_offline_dir_stat
          delegate_to: localhost
          become: false

        - name: Assert offline packages directory exists on the control node
          ansible.builtin.assert:
            that:
              - platform_offline_dir_stat.stat.exists
              - platform_offline_dir_stat.stat.isdir
            fail_msg: >-
              Offline packages directory {{ platform_offline_control_node_root }} does not exist.
              Ensure offline packages have been downloaded for
              {{ ansible_distribution }} {{ ansible_distribution_major_version }}.

    - name: Print Itential Platform installation details
      ansible.builtin.debug:
        msg:
          - "Platform packages: {{ platform_packages }}"
          - "Platform dependency packages: {{ platform_package_dependencies }}"
          - "NodeJS package: {{ platform_nodejs_package }}"
          - "Python version: {{ platform_python_version }}"
          - "Python packages: {{ platform_python_packages }}"
          - "Python base dependencies: {{ platform_python_base_dependencies }}"
          - "Python Platform dependencies: {{ platform_python_app_dependencies }}"
      when: not offline_install_enabled | bool

    - name: Validate offline install directory for the target OS
      when: offline_install_enabled | bool
      block:
        - name: Stat offline packages directory on the control node
          ansible.builtin.stat:
            path: "{{ platform_offline_control_node_root }}"
          register: platform_offline_dir_stat
          delegate_to: localhost
          become: false

        - name: Assert offline packages directory exists on the control node
          ansible.builtin.assert:
            that:
              - platform_offline_dir_stat.stat.exists
              - platform_offline_dir_stat.stat.isdir
            fail_msg: >-
              Offline packages directory {{ platform_offline_control_node_root }} does not exist.
              Ensure offline packages have been downloaded for
              {{ ansible_distribution }} {{ ansible_distribution_major_version }}.

    - name: Print Itential Platform installation details (offline)
      ansible.builtin.debug:
        msg: "Offline install using packages from {{ platform_offline_control_node_root }}"
      when: offline_install_enabled | bool
