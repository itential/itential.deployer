---

- name: Load Itential Platform release default variables
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - "platform-release-{{ platform_release }}.yml"
    - "platform-release-{{ platform_release | string | split('.') | first }}.yml"
    - "platform-release-undefined.yml"

- name: Verify Platform host requirements
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-host
  vars:
    component_name: "Platform"
    hw_specs_var_name: "platform_hw_specs"

# platform specific verification tasks go here...
- name: Verify connectivity to required public repositories
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-connectivity
  vars:
    component_name: "Platform"

# Vault itself isn't installed by this collection, but Platform is the component that
# integrates with it, so its repository is checked here when Vault integration is enabled.
- name: Verify connectivity to Vault's required public repositories
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-connectivity
  vars:
    component_name: "Vault"
  when: platform_configure_vault | bool

- name: Verify TLS certs for platform webserver are defined
  ansible.builtin.assert:
    that: platform_https_pki_src_dir is defined and platform_https_pki_src_dir | length > 0
    fail_msg: "TLS certificate directory is undefined. Itential Platform requires TLS certificates."
    success_msg: "TLS certificate directory is defined"
    quiet: true
  ignore_errors: true
  register: platform_tls_dir_validation
  when: platform_webserver_https_enabled | bool

- name: Verify that expected certificate files exist on the control node
  ansible.builtin.stat:
    path: "{{ platform_https_pki_src_dir }}/{{ item }}"
  loop:
    - "{{ platform_https_cert_file }}"
    - "{{ platform_https_key_file }}"
    - "{{ platform_https_ca_file }}"
  register: cert_file_stats
  delegate_to: localhost
  become: false
  when:
    - platform_webserver_https_enabled | bool
    - platform_tls_dir_validation is not failed

- name: Assert that all expected certificate files exist
  ansible.builtin.assert:
    that: cert_file_stats.results | map(attribute='stat.exists') | list | min
    fail_msg: "One or more expected certificate files are missing in {{ platform_https_pki_src_dir }}"
    success_msg: "All expected certificate files are present"
    quiet: true
  ignore_errors: true
  register: platform_tls_contents_validation
  when:
    - platform_webserver_https_enabled | bool
    - platform_tls_dir_validation is not failed

- name: Add TLS files error to list
  ansible.builtin.set_fact:
    validation_errors: "{{ validation_errors + ['Platform TLS: TLS files for Itential Platform webserver appear to be missing'] }}"
  when:
    - platform_webserver_https_enabled | bool
    - platform_tls_dir_validation is failed or platform_tls_contents_validation is failed

- name: Verify Platform host requirements
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-results
