---
# If true, logs out existing sessions for a user when they log in with a new session.
platform_auth_unique_sessions_enabled:

# Members of these groups will be implicitly assigned with admin permissions.
platform_auth_admin_groups:
  # - { "provenance": "Local AAA", "group": "pronghorn_admin" }

# Enables a AAA adapter to custom build the principal object for a user with a "buildPrincipal"
# method.
platform_auth_broker_principal_enabled:

# The name of the cookie used for a user session.
platform_auth_session_cookie_name:

# The time in minutes before a user session expires.
platform_auth_session_ttl:

# The time in minutes before a user principal expires. If not supplied it will fallback to
# platform_auth_session_ttl.
platform_auth_principal_ttl:

# The time in seconds before the RelayState from SSO expires.
platform_auth_relay_state_ttl: 600

# Enables a default user to be used for login when SSO is not configured and no AAA Adapter exists.
platform_default_user_enabled:

# The username of the default user.
platform_default_user_username:

# The password of the default user.
platform_default_user_password:
