---
# A toggle to instruct the webserver to include HTTP cache control headers on the response. If
# left unset in platform.properties, Itential Platform itself defaults this to false; the
# deployer explicitly overrides that default to true.
platform_webserver_cache_control_enabled: true

# Timeout to use for incoming HTTP requests to the platform API, in milliseconds.
platform_webserver_timeout:

# The value of the HTTP Access-Control-Allow-Origin header returned to clients.
platform_webserver_response_header_access_control_allow_origin:

# If true, allows the webserver to respond to insecure HTTP requests.
platform_webserver_http_enabled: true

# The port on which the webserver listens for HTTP requests.
platform_webserver_http_port: 3000

# If true, allows the webserver to respond to secure HTTPS requests.
platform_webserver_https_enabled: true

# The port on which the webserver listens for HTTPS requests.
platform_webserver_https_port: 3443

# Public key used for HTTPS connections, as a PEM-encoded string. Alternative to the file-based
# key deployed via platform_webserver_https_copy_certs when the key contents should be inlined.
platform_webserver_https_key_contents:

# The passphrase for the private key used to enable TLS sessions.
platform_webserver_https_passphrase:

# Certificate used for HTTPS connections, as a PEM-encoded string. Alternative to the file-based
# cert deployed via platform_webserver_https_copy_certs when the cert contents should be inlined.
platform_webserver_https_cert_contents:

# Minimum permitted TLS version. Overrides platform_webserver_https_secure_protocol.
# Valid values: TLSv1.3, TLSv1.2, TLSv1.1, TLSv1
platform_webserver_https_tls_min_version:

# Maximum permitted TLS version. Overrides platform_webserver_https_secure_protocol.
# Valid values: TLSv1.3, TLSv1.2, TLSv1.1, TLSv1
platform_webserver_https_tls_max_version:

# The set of allowed SSL/TLS protocol versions. Ignored when either tls_min_version or
# tls_max_version is given.
platform_webserver_https_secure_protocol: TLS_method

# The allowed SSL/TLS cipher suite.
platform_webserver_https_ciphers:

# Specifies the number of renegotiations that are allowed in a single HTTPS connection.
platform_webserver_https_client_reneg_limit:

# Specifies the time renegotiation window in seconds for a single HTTPS connection.
platform_webserver_https_client_reneg_window:

# The set of allowed HTTP verbs in addition to those defined in the standard HTTP/1.1 protocol.
platform_webserver_http_allowed_optional_verbs:
