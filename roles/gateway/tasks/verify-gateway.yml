---
# Unlike verify-mongodb.yml/verify-redis.yml/verify-platform.yml, this does not call
# common:verify-host — Gateway has no documented hardware-spec requirements (gateway_hw_specs)
# in this collection yet. This task file only verifies connectivity to Gateway's required
# public repositories.

- name: Initialize validation errors list
  ansible.builtin.set_fact:
    validation_errors: []

- name: Verify connectivity to required public repositories
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-connectivity
  vars:
    component_name: "Gateway"

- name: Display failed validation results
  ansible.builtin.debug:
    msg: "{{ validation_errors }}"
  when: connectivity_validation is failed

- name: Verify that all tests passed
  ansible.builtin.assert:
    that:
      - "connectivity_validation is not failed"
    fail_msg: "See above, assertions not passed! ✗"
    success_msg: "All assertions passed! ✓"
  ignore_errors: true
  register: component_verification

# Recorded per-host so playbooks/verify.yml can do one final, non-fatal-until-the-end
# assert after every component has been checked, instead of aborting the whole
# ansible-playbook run the moment one component's checks fail on a host. ANDed with any
# prior value (default true) rather than overwritten -- a host can belong to more than one
# component group (e.g. an all-in-one host), and a later component passing must not erase
# an earlier component's failure on the same host.
- name: Record overall verification result for this host
  ansible.builtin.set_fact:
    verification_passed: "{{ (verification_passed | default(true)) and (component_verification is not failed) }}"
