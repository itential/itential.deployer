---
- name: Verify Gateway host requirements
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-host
  vars:
    component_name: "Gateway"
    hw_specs_var_name: "gateway_hw_specs"

- name: Verify connectivity to required public repositories
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-connectivity
  vars:
    required_repositories: "{{ gateway_required_repositories }}"

- name: Report Gateway results
  ansible.builtin.include_role:
    name: common
    tasks_from: verify-results
  vars:
    component_name: "Gateway"
