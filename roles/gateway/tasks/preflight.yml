---
- name: Include release vars
  ansible.builtin.include_vars:
    file: "{{ item }}"
  with_first_found:
    - "gateway-release-{{ gateway_release }}.yml" # Prefer this new format
    - "{{ gateway_release }}-{{ ansible_distribution
      | lower }}-{{ ansible_distribution_major_version }}.yml"
    - "release-undefined.yml"

- name: Run common checks
  ansible.builtin.include_role:
    name: preflight
  vars:
    preflight_url_checks:

- name: Create temporary working directory
  ansible.builtin.tempfile:
    state: directory
  register: workingdir

- name: Set pass to true if all conditions pass
  ansible.builtin.set_fact:
    results: '{{ results | combine({"pass": true}) }}'
  when:
    - results.cpuCores >= gateway_cpu_cores
    - results.get(mountvarname, 0) >= gateway_free_disk_space
    - results.memory >= gateway_ram
    - results.url_status.values() | unique | length == 1 and
      results.url_status.values() | unique | first == 200

- name: Create Gateway preflight results
  ansible.builtin.template:
    src: "gateway.preflight.j2"
    dest: "{{ workingdir.path }}/preflightResults.txt"
    mode: '0777'

- name: Fetch Gateway results
  ansible.builtin.fetch:
    src: "{{ workingdir.path }}/preflightResults.txt"
    dest: "{{ preflight_directory }}/gateway_{{ inventory_hostname }}_results.txt"
    flat: true

- name: Remove temporary working directory
  ansible.builtin.file:
    path: "{{ workingdir.path }}"
    state: absent

- name: Check if host passed preflight checks.
  ansible.builtin.assert:
    that: results["pass"] == true
    fail_msg: "Platform host did not pass the preflight checks"
    success_msg: "Platform host passed the preflight checks"
  when:
    - preflight_enforce_checks is defined
    - preflight_enforce_checks

- name: Warn if HTTPS enabled without certificate management
  ansible.builtin.debug:
    msg: |
      WARNING: Potential misconfiguration detected
      
      gateway_https_enabled: true
      gateway_pki_copy_certs: false
      
      Gateway expects certificates at:
        - {{ gateway_https_cert_file }}
        - {{ gateway_https_key_file }}
        - {{ gateway_https_ca_file }}
      
      If these files don't exist, Gateway will fail to start.
      
      To fix:
        - Set gateway_pki_copy_certs: true, OR
        - Manually ensure certificates exist at above paths
  when:
    - gateway_https_enabled | bool
    - not gateway_pki_copy_certs | bool
