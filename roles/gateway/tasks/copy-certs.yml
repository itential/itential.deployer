---
- name: Validate gateway_pki_src_dir is defined
  ansible.builtin.assert:
    that:
      - gateway_pki_src_dir is defined
      - gateway_pki_src_dir | length > 0
    fail_msg: |
      gateway_pki_src_dir is not defined or is empty.
      Set gateway_pki_src_dir in your inventory when gateway_pki_copy_certs is enabled.
    success_msg: "gateway_pki_src_dir is properly configured: {{ gateway_pki_src_dir }}"

- name: Copy the cert file
  ansible.builtin.copy:
    src: "{{ gateway_https_cert_source }}"
    dest: "{{ gateway_https_cert_file }}"
    mode: "0644"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_cert_source | length > 0
  notify: restart automation-gateway

- name: Copy the key file
  ansible.builtin.copy:
    src: "{{ gateway_https_key_source }}"
    dest: "{{ gateway_https_key_file }}"
    mode: "0600"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_key_source | length > 0
  notify: restart automation-gateway

- name: Copy the root CA file
  ansible.builtin.copy:
    src: "{{ gateway_https_ca_source }}"
    dest: "{{ gateway_https_ca_file }}"
    mode: "0644"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_ca_source | length > 0
  notify: restart automation-gateway
