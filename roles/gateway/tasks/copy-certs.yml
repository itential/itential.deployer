---
- name: Copy the cert file
  ansible.builtin.copy:
    src: "{{ gateway_https_cert_source }}"
    dest: "{{ gateway_https_cert_file }}"
    mode: "0644"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_cert_source | length > 0
  notify: restart automation-gateway

- name: Copy the key file
  ansible.builtin.copy:
    src: "{{ gateway_https_key_source }}"
    dest: "{{ gateway_https_key_file }}"
    mode: "0600"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_key_source | length > 0
  notify: restart automation-gateway

- name: Copy the root CA file
  ansible.builtin.copy:
    src: "{{ gateway_https_ca_source }}"
    dest: "{{ gateway_https_ca_file }}"
    mode: "0644"
    owner: "{{ gateway_user }}"
    group: "{{ gateway_group }}"
  when: gateway_https_ca_source | length > 0
  notify: restart automation-gateway
