---
# Public repositories required for installing Itential Gateway, checked by the verify_gateway
# playbook. Mirrors the Gateway rows of the "Required Public Repositories" table in README.md.
gateway_required_repositories:
  - url: "https://registry.aws.itential.com"
    type: bare
    notes: "Itential packages"
  - url: "https://galaxy.ansible.com"
    type: bare
    notes: "Community Ansible collections"
  - url: "https://pypi.org"
    type: bare
    notes: "Python modules"
