---
# ============================================================================
# MongoDB PKI Configuration - All components customizable
# ============================================================================

# Base PKI directory - override to use different root location
mongodb_pki_base_dir: /etc/pki/mongodb

# Subdirectory names - customize the layout
mongodb_pki_private_subdir: private

# Derived subdirectory paths - built from base + subdir name
mongodb_pki_private_dir: "{{ mongodb_pki_base_dir }}/{{ mongodb_pki_private_subdir }}"

# ============================================================================
# Certificate and Key Filenames - Customize naming
# ============================================================================

# TLS server certificate filename (combined cert + key PEM)
mongodb_tls_server_cert_filename: "{{ inventory_hostname }}.pem"

# CA certificate filename
mongodb_tls_ca_cert_filename: ca-bundle.crt

# Replica set authentication keyfile filename
mongodb_replica_keyfile_filename: replica.key

# ============================================================================
# Full Certificate Paths - Built from components, but can be overridden
# ============================================================================

# TLS server certificate path (used by mongod for TLS connections)
mongodb_cert_keyfile_destination: "{{ mongodb_pki_base_dir }}/{{ mongodb_tls_server_cert_filename }}"

# CA certificate path (used to validate client certificates)
mongodb_root_ca_file_destination: "{{ mongodb_pki_base_dir }}/{{ mongodb_tls_ca_cert_filename }}"

# Replica set keyfile path (used for internal authentication)
mongodb_auth_keyfile_destination: "{{ mongodb_pki_private_dir }}/{{ mongodb_replica_keyfile_filename }}"

# ============================================================================
# Source Directory and File Paths - Define source directory in inventory
# ============================================================================

# Source directory for certificate files (on Ansible controller)
# Set this in your inventory to point to your certificate directory
mongodb_pki_src_dir: ""

mongodb_ssl_root_dir: "{{ mongodb_pki_base_dir }}"
# Source paths - built from source directory + filename
# These auto-build from mongodb_pki_src_dir, but can be overridden individually
mongodb_cert_keyfile_source: "{{ mongodb_pki_src_dir }}/{{ mongodb_tls_server_cert_filename }}"
mongodb_root_ca_file_source: "{{ mongodb_pki_src_dir }}/{{ mongodb_tls_ca_cert_filename }}"
mongodb_auth_keyfile_source: "{{ mongodb_pki_src_dir }}/{{ mongodb_replica_keyfile_filename }}"

# ============================================================================
# File Ownership - Customize per environment
# ============================================================================

# Owner for PKI directories and files
mongodb_pki_owner: "{{ mongodb_owner }}"

# Group for PKI directories and files
mongodb_pki_group: "{{ mongodb_group }}"

# ============================================================================
# File Permissions - Customize per security requirements
# ============================================================================

# Base PKI directory permissions
mongodb_pki_base_dir_mode: "0750"

# Private subdirectory permissions
mongodb_pki_private_dir_mode: "0700"

# TLS server certificate permissions
mongodb_tls_server_cert_mode: "0640"

# CA certificate permissions
mongodb_tls_ca_cert_mode: "0644"

# Replica keyfile permissions
mongodb_replica_keyfile_mode: "0400"