---
- name: Create MongoDB PKI base directory
  ansible.builtin.file:
    state: directory
    path: "{{ mongodb_pki_base_dir }}"
    owner: "{{ mongodb_owner }}"
    group: "{{ mongodb_group }}"
    mode: "{{ mongodb_pki_base_dir_mode }}"
  tags:
    - mongodb
    - mongodb_certificates
    - certificates

- name: Create MongoDB private directory
  ansible.builtin.file:
    state: directory
    path: "{{ mongodb_pki_private_dir }}"
    owner: "{{ mongodb_owner }}"
    group: "{{ mongodb_group }}"
    mode: "{{ mongodb_pki_private_dir_mode }}"
  tags:
    - mongodb
    - mongodb_certificates
    - certificates

- name: Copy certificate to MongoDB host if TLS enabled
  ansible.builtin.copy:
    src: "{{ mongodb_cert_keyfile_source }}"
    dest: "{{ mongodb_cert_keyfile_destination }}"
    mode: "0640"
    group: "{{ mongodb_group }}"
    owner: "{{ mongodb_owner }}"
  notify: restart mongod
  tags:
    - mongodb
    - mongodb_certificates
    - certificates

- name: Copy CA certificate to MongoDB host if TLS enabled
  ansible.builtin.copy:
    src: "{{ mongodb_root_ca_file_source }}"
    dest: "{{ mongodb_root_ca_file_destination }}"
    mode: "0644"
    group: "{{ mongodb_group }}"
    owner: "{{ mongodb_owner }}"
  notify: restart mongod
  tags:
    - mongodb
    - mongodb_certificates
    - certificates

- name: Create MongoDB config file (TLS)
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: "{{ mongodb_conf_file }}"
    owner: "{{ mongodb_owner }}"
    group: "{{ mongodb_group }}"
    mode: "0644"
  vars:
    stage: "tls"
  notify: restart mongod
  tags:
    - mongodb
    - mongodb_config

- name: Flush handlers to restart mongod with TLS config
  ansible.builtin.meta: flush_handlers
  tags:
    - mongodb
    - mongodb_certificates
    - certificates
