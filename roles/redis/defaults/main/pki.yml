---
# ============================================================================
# Redis PKI Configuration - All components customizable
# ============================================================================

# Base PKI directory - override to use different root location
redis_pki_base_dir: /etc/pki/redis

# Subdirectory names - customize the layout
redis_pki_private_subdir: private

# Derived subdirectory paths - built from base + subdir name
redis_pki_private_dir: "{{ redis_pki_base_dir }}/{{ redis_pki_private_subdir }}"

# ============================================================================
# Certificate and Key Filenames - Customize naming
# ============================================================================

# Redis server certificate filename
redis_tls_cert_filename: "{{ inventory_hostname }}.crt"

# Redis server private key filename
redis_tls_key_filename: "{{ inventory_hostname }}.key"

# Redis CA certificate filename
redis_tls_ca_filename: ca-bundle.crt

# Redis DH parameters filename
redis_tls_dh_params_filename: dhparams.pem

# Redis Sentinel certificate filename
redis_sentinel_tls_cert_filename: sentinel.crt

# Redis Sentinel private key filename
redis_sentinel_tls_key_filename: sentinel.key

# ============================================================================
# Redis Server Full Certificate Paths - Built from components
# ============================================================================

# Redis server certificate path
redis_tls_cert_file: "{{ redis_pki_base_dir }}/{{ redis_tls_cert_filename }}"

# Redis server private key path
redis_tls_key_file: "{{ redis_pki_private_dir }}/{{ redis_tls_key_filename }}"

# Redis CA certificate path
redis_tls_ca_file: "{{ redis_pki_base_dir }}/{{ redis_tls_ca_filename }}"

# Redis DH parameters path
redis_tls_dh_params_file: "{{ redis_pki_base_dir }}/{{ redis_tls_dh_params_filename }}"

# ============================================================================
# Redis Sentinel Full Certificate Paths - Built from components
# ============================================================================

# Sentinel certificate path
redis_sentinel_tls_cert_file: "{{ redis_pki_base_dir }}/{{ redis_sentinel_tls_cert_filename }}"

# Sentinel private key path
redis_sentinel_tls_key_file: "{{ redis_pki_private_dir }}/{{ redis_sentinel_tls_key_filename }}"

# ============================================================================
# Source Directory - Define in inventory
# ============================================================================

# Source directory for certificate files (on Ansible controller)
redis_pki_src_dir: ""

# ============================================================================
# Source File Paths - Built from source directory + filename
# ============================================================================

# Redis server source paths - auto-build from source dir + filename
redis_tls_cert_source: "{{ redis_pki_src_dir }}/{{ redis_tls_cert_filename }}"
redis_tls_key_source: "{{ redis_pki_src_dir }}/{{ redis_tls_key_filename }}"
redis_tls_ca_source: "{{ redis_pki_src_dir }}/{{ redis_tls_ca_filename }}"
redis_tls_dh_params_source: "{{ redis_pki_src_dir }}/{{ redis_tls_dh_params_filename }}"

# Sentinel source paths - auto-build from source dir + filename
redis_sentinel_tls_cert_source: "{{ redis_pki_src_dir }}/{{ redis_sentinel_tls_cert_filename }}"
redis_sentinel_tls_key_source: "{{ redis_pki_src_dir }}/{{ redis_sentinel_tls_key_filename }}"

# ============================================================================
# File Ownership - Customize per environment
# ============================================================================

# Owner for PKI directories and files
redis_pki_owner: redis

# Group for PKI directories and files
redis_pki_group: redis

# ============================================================================
# File Permissions - Customize per security requirements
# ============================================================================

# Base PKI directory permissions
redis_pki_base_dir_mode: "0750"

# Private subdirectory permissions
redis_pki_private_dir_mode: "0700"

# Server certificate permissions
redis_tls_cert_mode: "0644"

# Server private key permissions
redis_tls_key_mode: "0600"

# CA certificate permissions
redis_tls_ca_mode: "0644"

# DH parameters permissions
redis_tls_dh_params_mode: "0644"

# Sentinel certificate permissions
redis_sentinel_tls_cert_mode: "0644"

# Sentinel private key permissions
redis_sentinel_tls_key_mode: "0600"