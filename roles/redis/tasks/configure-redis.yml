---
- name: Create Redis systemd file
  ansible.builtin.template:
    src: redis.service.j2
    dest: /usr/lib/systemd/system/redis.service
    owner: root
    group: root
    mode: "0644"

- name: Calculate Redis maxmemory (dedicated node)
  when: (redis_maxmemory_bytes | default(0) | int) == 0
  vars:
    ram_mb: "{{ ansible_facts.memtotal_mb | int }}"
    ratio: "{{ redis_maxmemory_ratio | default('0.60') | float }}"
    min_mb: "{{ redis_maxmemory_min_mb | default(512) | int }}"
    raw_mb: "{{ ((ram_mb | int) * (ratio | float)) | int }}"
    clamped_mb: "{{ [min_mb | int, raw_mb | int] | max }}"
  ansible.builtin.set_fact:
    redis_maxmemory_bytes: "{{ ((clamped_mb | int) * 1024 * 1024) | int }}"
  tags: configure_redis

- name: Use template to generate redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_file }}"
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
    mode: "0640"
    setype: redis_conf_t
    backup: true
  tags: configure_redis

- name: Deploy logrotate config for Redis
  ansible.builtin.template:
    src: redis.logrotate.j2
    dest: /etc/logrotate.d/redis
    owner: root
    group: root
    mode: '0644'
