---
- name: Create Redis systemd file
  ansible.builtin.template:
    src: redis.service.j2
    dest: /usr/lib/systemd/system/redis.service
    owner: root
    group: root
    mode: "0644"

- name: Calculate Redis maxmemory (dedicated node)
  vars:
    redis_maxmemory_ratio: "0.60"       # keep as string, cast later
    redis_maxmemory_min_mb: 512         # avoid tiny values on small VMs
    ram_mb: "{{ ansible_facts.memtotal_mb | int }}"
    raw_mb: "{{ (ram_mb | int * (redis_maxmemory_ratio | float)) | int }}"
    clamped_mb: "{{ [redis_maxmemory_min_mb | int, raw_mb | int] | max }}"
  ansible.builtin.set_fact:
    redis_maxmemory_bytes: "{{ (clamped_mb | int) * 1024 * 1024 }}"
  tags: configure_redis

- name: Use template to generate redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_file }}"
    owner: "{{ redis_owner }}"
    group: "{{ redis_group }}"
    mode: "0640"
    setype: redis_conf_t
    backup: true
  tags: configure_redis

- name: Deploy logrotate config for Redis
  ansible.builtin.template:
    src: redis.logrotate.j2
    dest: /etc/logrotate.d/redis
    owner: root
    group: root
    mode: '0644'
