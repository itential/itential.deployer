---
all:
  vars:
    # The Platform release must be defined.
    # Valid values: 6, 6.0
    platform_release: 6

    # Declare the purpose of the environment to help the verification stage check resources.
    # The environment is not required for the installation playbooks. It is required for the
    # certify and verify playbooks.
    # Valid values: dev, test, prod
    env: <env>

  children:
    redis_master:
      hosts:
        dc1-redis01.example.com:

    redis_replica:
      hosts:
        dc1-redis02.example.com:
        dc2-redis01.example.com:
        dc2-redis02.example.com:

    redis_sentinel:
      hosts:
        dc1-sentinel01.example.com:
        dc2-sentinel01.example.com:
        dc3-sentinel01.example.com:

    mongodb:
      hosts:
        dc1-mongodb01.example.com:
        dc1-mongodb02.example.com:
        dc2-mongodb01.example.com:
        dc2-mongodb02.example.com:

    mongodb_arbiter:
      hosts:
        dc3-arbiter01.example.com:

    mongodb_nodes:
      hosts:
        dc1-mongodb01.example.com:
        dc1-mongodb02.example.com:
        dc2-mongodb01.example.com:
        dc2-mongodb02.example.com:
        dc3-arbiter01.example.com:
      vars:
        mongodb_replication_enabled: true

    platform:
      hosts:
        platform01.example.com:
        platform02.example.com:
      vars:
        # The Platform encryption key must be defined.
        # open64-length hex string, representing a 256-bit AES encryption key
        # Example command to generate key: 'openssl rand -hex 32'
        platform_encryption_key: <key>

        # The Platform packages to install must be defined.
        # NOTE: The Platform packages list varies depending on entitlement.
        platform_packages:
          - itential-platform-<version>.noarch.rpm

        # MongoDB connection
        platform_mongo_url: mongodb://itential:itential@dc1-mongodb01.example.com:27017,dc1-mongodb02.example.com:27017,dc2-mongodb01.example.com:27017,dc2-mongodb02.example.com:27017,dc3-arbiter01.example.com:27017/itential?replicaSet=rs0

        # Redis Sentinel connection
        platform_redis_sentinels:
          - host: dc1-sentinel01.example.com
            port: 26379
          - host: dc2-sentinel01.example.com
            port: 26379
          - host: dc3-sentinel01.example.com
            port: 26379

    gateway:
      hosts:
        gateway01.example.com:
      vars:
        # The Gateway4 release must be defined.
        # Valid values: 4.2, 4.3
        gateway_release: 4.3

        # The Gateway wheel file to install must be defined.
        gateway_whl_file: automation_gateway-<version>-py3-none-any.whl
