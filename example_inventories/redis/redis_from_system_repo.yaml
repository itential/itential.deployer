---
all:
  vars:
    # The Platform release must be defined.
    #  - valid values: 6, 6.0
    platform_release: 6

  children:
    redis_master:
      hosts:
        redis01.example.com:
      vars:
        # In this example, Redis is installed using the system YUM repo (not Remi).
        # The Redis install from source variable must be overridden and the Redis packages
        # must be defined. The Redis packages list may vary depending on OS.
        redis_install_from_source: false
        redis_packages:
          - redis
